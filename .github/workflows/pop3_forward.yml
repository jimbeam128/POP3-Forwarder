name: POP3-Forwarder
on:
  workflow_dispatch:
jobs:
  forward:
    runs-on: ubuntu-latest

    # Secrets werden als Environment Variables gesetzt
    env:
      POP3_HOST: ${{ secrets.POP3_HOST }}
      POP3_USER: ${{ secrets.POP3_USER }}
      POP3_PASS: ${{ secrets.POP3_PASS }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_FROM: ${{ secrets.SMTP_FROM }}       # hier wird das Secret genutzt
      TARGET_EMAIL: ${{ secrets.TARGET_EMAIL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore failure counter
        uses: actions/cache@v4
        with:
          path: consecutive_failures.txt
          key: pop3-failure-counter
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install --upgrade pip
        
      - name: Restore failure counter
        uses: actions/cache@v4
        with:
          path: consecutive_failures.txt
          key: pop3-failure-counter-${{ github.ref }}
          restore-keys: |
            pop3-failure-counter-

      - name: Run POP3 Forwarder
        run: python forwarder.py

      - name: Show failure counter in summary
        if: always()
        run: |
          echo "## 📊 POP3 Forwarder Status" >> $GITHUB_STEP_SUMMARY

          if [ -f consecutive_failures.txt ]; then
            COUNT=$(cat consecutive_failures.txt)
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Consecutive failures:** $COUNT" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Consecutive failures:** 0 (last run successful)" >> $GITHUB_STEP_SUMMARY
          fi
      - name: Save updated failure counter
        uses: actions/cache@v4
        with:
          path: consecutive_failures.txt
          key: pop3-failure-counter-${{ github.ref }}    
